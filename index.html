<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER External Brain</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .accent-text { color: #03dac6; }
        .accent-bg { background-color: #03dac6; color: #121212; }
        .tab-active { border-bottom: 2px solid #03dac6; color: #03dac6; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto pb-12">
    <header class="flex justify-between items-center mb-4 border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-xl font-bold accent-text">ER EXTERNAL BRAIN</h1>
            <p class="text-xs text-gray-400">Cloud Sync (Google Sheets & Image Support)</p>
        </div>
        <button onclick="loadData()" class="px-3 py-1.5 text-xs font-semibold accent-bg rounded-lg">🔄 รีเฟรช</button>
    </header>

    <div class="flex space-x-4 mb-4 border-b border-gray-800 pb-2 text-sm font-semibold">
        <button onclick="switchTab('all')" id="tab-all" class="tab-active pb-1">ทั้งหมด</button>
        <button onclick="switchTab('drugs')" id="tab-drugs" class="text-gray-400 pb-1">ยา (Drugs)</button>
        <button onclick="switchTab('ekg')" id="tab-ekg" class="text-gray-400 pb-1">EKG</button>
        <button onclick="switchTab('procedures')" id="tab-procedures" class="text-gray-400 pb-1">หัตถการ</button>
    </div>

    <div class="mb-4">
        <input type="text" id="searchInput" placeholder="🔍 ค้นหาอาการ, ยา, EKG, หัตถการ..." class="w-full p-3 rounded-xl card text-sm focus:outline-none focus:border-[#03dac6]" oninput="filterData()">
    </div>

    <div id="loading" class="text-center py-10 text-gray-400">กำลังซิงก์ข้อมูลจาก Google Sheets...</div>
    <div id="contentContainer" class="space-y-4"></div>

    <script>
        // ลิงก์ Google Sheets CSV ของคุณ
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRy4AcfQZ_Zn05cPozeFLcY7jQkM0Q-C_ZqSjUIOjXGkUwVFz87d7GuADRm8Q_cag/pub?output=csv";
        
        let globalData = [];
        let currentTab = 'all';

        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('contentContainer').innerHTML = '';
            
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    globalData = results.data;
                    document.getElementById('loading').style.display = 'none';
                    renderData(globalData);
                },
                error: function(err) {
                    document.getElementById('loading').innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูลจาก Google Sheets";
                    console.error(err);
                }
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            ['all', 'drugs', 'ekg', 'procedures'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if(t === tab) {
                    el.className = "tab-active pb-1 font-bold";
                } else {
                    el.className = "text-gray-400 pb-1";
                }
            });
            filterData();
        }

        function renderData(data) {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-6">ไม่พบข้อมูล</div>';
                return;
            }
            
            data.forEach(item => {
                // คัดกรองประเภทตาม Tab หรือตรวจสอบฟิลด์
                const isDrug = item.generic || (item.id && item.id.startsWith('d'));
                const isEkg = item.diagnosis || (item.id && item.id.startsWith('e'));
                const isProc = item.name || (item.id && item.id.startsWith('p'));

                if(currentTab === 'drugs' && !isDrug) return;
                if(currentTab === 'ekg' && !isEkg) return;
                if(currentTab === 'procedures' && !isProc) return;

                if(!item.generic && !item.diagnosis && !item.name) return;
                
                const card = document.createElement('div');
                card.className = 'card p-4 rounded-xl shadow-md space-y-2';
                
                let title = item.generic || item.diagnosis || item.name || 'ไม่มีชื่อ';
                let badge = item.brand || item.danger || item.indication || '';
                let practice = item.usual_practice || item.step5_management || item.steps || '';
                let notesOrEquip = item.notes || item.equipment || '';
                let imageUrl = item.image_url ? item.image_url.trim() : '';

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h2 class="font-bold text-base accent-text">${title}</h2>
                        <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-300 max-w-[50%] truncate">${badge}</span>
                    </div>
                    ${practice ? `<p class="text-sm text-gray-200"><strong>Practical/Management:</strong> ${practice}</p>` : ''}
                    ${notesOrEquip ? `<p class="text-xs text-gray-400"><strong>Notes/Equipment:</strong> ${notesOrEquip}</p>` : ''}
                    ${imageUrl ? `<div class="mt-2"><img src="${imageUrl}" class="rounded-lg max-h-56 object-cover w-full border border-gray-700" alt="Clinical Image"/></div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function filterData() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = globalData.filter(item => {
                const matchesKeyword = JSON.stringify(item).toLowerCase().includes(keyword);
                if(!matchesKeyword) return false;

                const isDrug = item.generic || (item.id && item.id.startsWith('d'));
                const isEkg = item.diagnosis || (item.id && item.id.startsWith('e'));
                const isProc = item.name || (item.id && item.id.startsWith('p'));

                if(currentTab === 'drugs' && !isDrug) return false;
                if(currentTab === 'ekg' && !isEkg) return false;
                if(currentTab === 'procedures' && !isProc) return false;

                return true;
            });
            renderData(filtered);
        }

        window.onload = loadData;
    </script>
</body>
</html>
