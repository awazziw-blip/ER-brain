<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY ER EXTERNAL BRAIN</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#03dac6">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-hover: #2a2a2a;
            --text-main: #f0f0f0;
            --text-sub: #a0a0a0;
            --accent: #03dac6;
            --warning: #ffb74d;
            --danger: #cf6679;
            --border: #333333;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .header-left h1 { font-size: 1.2rem; margin: 0; color: var(--accent); }
        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            background: var(--accent);
            color: #000;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            color: var(--text-main);
            transition: 0.2s;
        }
        .nav-btn:hover { background: var(--surface-hover); }
        .nav-btn.active { border-color: var(--accent); background: #242424; }
        .nav-btn h3 { margin: 0 0 4px 0; font-size: 0.9rem; color: #fff; }
        .nav-btn span { font-size: 0.75rem; color: var(--text-sub); }
        .content-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            min-height: 450px;
        }
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn-sub {
            background: #333;
            color: #fff;
            border: 1px solid var(--border);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #242424;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .item-card {
            background: #252525;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .standard-box {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin: 8px 0;
            background: rgba(3, 218, 198, 0.05);
            font-size: 0.85rem;
        }
        .usual-box {
            border-left: 3px solid var(--warning);
            padding-left: 10px;
            margin: 8px 0;
            background: rgba(255, 183, 77, 0.05);
            font-size: 0.85rem;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .tag-ready { background: #03dac6; color: #000; }
        .tag-refresh { background: #ffb74d; color: #000; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>MY ER EXTERNAL BRAIN</h1>
            <span class="badge">JSON SYNCED</span>
        </div>
        <button class="btn-sub" onclick="renderSettings()" style="width: auto; background: var(--surface);">⚙️ ตั้งค่า</button>
    </header>

    <div class="nav-grid">
        <button class="nav-btn" onclick="renderReview()" id="btn-review">
            <h3>🧠 Daily Review</h3>
            <span>Adaptive (&lt;=15m)</span>
        </button>
        <button class="nav-btn" onclick="renderDrugs()" id="btn-drugs">
            <h3>💊 Drugs</h3>
            <span>Standard vs Usual</span>
        </button>
        <button class="nav-btn" onclick="renderEKG()" id="btn-ekg">
            <h3>❤️ EKG Module</h3>
            <span>5-Step & Error Bank</span>
        </button>
        <button class="nav-btn" onclick="renderProcedures()" id="btn-procedures">
            <h3>🔧 Procedures</h3>
            <span>Walkthrough Cards</span>
        </button>
    </div>

    <div id="app-root" class="content-box">กำลังโหลดฐานข้อมูลจาก GitHub...</div>

    <script>
        let db = { drugs: [], ekg: [], procedures: [] };
        const dbKey = 'er_brain_db_v1_json';

        // โหลดข้อมูลจากฐานข้อมูล JSON บน GitHub หรือ LocalStorage
        async function initDatabase() {
            try {
                const response = await fetch('./database.json');
                if (response.ok) {
                    db = await response.json();
                    localStorage.setItem(dbKey, JSON.stringify(db));
                } else {
                    throw new Error('ไม่สามารถโหลด database.json ได้');
                }
            } catch (err) {
                console.warn("โหลดจาก JSON ไม่สำเร็จ กำลังใช้ข้อมูลสำรองในเครื่อง:", err);
                const savedData = localStorage.getItem(dbKey);
                if (savedData) {
                    db = JSON.parse(savedData);
                }
            }
            renderReview();
        }

        function saveDB() {
            localStorage.setItem(dbKey, JSON.stringify(db));
        }

        function setActiveNav(btnId) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btnId) {
                const btn = document.getElementById(btnId);
                if (btn) btn.classList.add('active');
            }
        }

        // ==========================================
        // SETTINGS (BACKUP & RESTORE)
        // ==========================================
        function renderSettings() {
            setActiveNav(null);
            const root = document.getElementById('app-root');
            root.innerHTML = `
                <h3 style="margin-top:0; color:var(--accent);">⚙️ ระบบจัดการข้อมูล (Backup & Restore)</h3>
                <p style="font-size:0.85rem; color:var(--text-sub);">จัดการฐานข้อมูลเพื่อป้องกันข้อมูลสูญหาย หรือโอนย้ายข้อมูลข้ามอุปกรณ์</p>
                
                <div class="item-card" style="margin-top:20px;">
                    <strong style="color:var(--accent); font-size:1rem;">💾 สำรองข้อมูล (Export)</strong>
                    <p style="font-size:0.85rem; color:var(--text-sub);">ดาวน์โหลดข้อมูลทั้งหมดเก็บไว้เป็นไฟล์ .json</p>
                    <button class="btn" onclick="exportData()">ดาวน์โหลดไฟล์ Backup</button>
                </div>

                <div class="item-card" style="margin-top:20px;">
                    <strong style="color:var(--warning); font-size:1rem;">📂 กู้คืน/นำเข้าข้อมูล (Import)</strong>
                    <p style="font-size:0.85rem; color:var(--text-sub);">เลือกไฟล์ Backup เพื่อกู้คืน (ข้อมูลในเครื่องจะถูกแทนที่ทั้งหมด)</p>
                    <input type="file" id="import-file" accept=".json" style="background:transparent; border:1px solid #444; padding:6px; font-size:0.8rem; margin-bottom:8px;">
                    <button class="btn" style="background:var(--warning); color:#000;" onclick="importData()">นำเข้าข้อมูล</button>
                </div>

                <div class="item-card" style="margin-top:30px; border-color:var(--danger);">
                    <strong style="color:var(--danger); font-size:1rem;">🔄 รีเฟรชฐานข้อมูลจาก GitHub</strong>
                    <p style="font-size:0.85rem; color:var(--text-sub);">ดึงข้อมูลล่าสุดจากไฟล์ database.json บน GitHub มาใช้อีกครั้ง</p>
                    <button class="btn" style="background:var(--danger); color:#000;" onclick="initDatabase(); alert('โหลดข้อมูลล่าสุดจาก GitHub เรียบร้อยแล้ว');">ดึงข้อมูลใหม่จาก GitHub</button>
                </div>
            `;
        }

        function exportData() {
            const dataStr = JSON.stringify(db, null, 4);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = 'ER_External_Brain_' + new Date().toISOString().slice(0,10) + '.json';

            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            document.body.appendChild(linkElement);
            linkElement.click();
            document.body.removeChild(linkElement);
        }

        function importData() {
            const fileInput = document.getElementById('import-file');
            if (!fileInput.files.length) {
                alert("กรุณาเลือกไฟล์ .json ก่อนครับ");
                return;
            }
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const importedDB = JSON.parse(e.target.result);
                    if (importedDB && Array.isArray(importedDB.drugs) && Array.isArray(importedDB.ekg)) {
                        db = importedDB;
                        saveDB();
                        alert("✅ นำเข้าข้อมูลสำเร็จ!");
                        renderReview();
                    } else {
                        alert("❌ ไฟล์ไม่ถูกต้อง โครงสร้างข้อมูลไม่ตรงกับระบบ");
                    }
                } catch (err) {
                    alert("❌ เกิดข้อผิดพลาดในการอ่านไฟล์: " + err);
                }
            };
            reader.readAsText(file);
        }

        // ==========================================
        // MODULE RENDERERS
        // ==========================================
        function renderReview() {
            setActiveNav('btn-review');
            const root = document.getElementById('app-root');
            root.innerHTML = `
                <h3 style="margin-top:0;">🧠 Daily Active Recall</h3>
                <p style="font-size:0.8rem; color:var(--text-sub); margin-bottom:12px;">จำกัดเซสชัน 10-15 นาที</p>
                <div class="item-card">
                    <strong style="color:var(--accent);">Case 1: Septic Shock Prescribing</strong>
                    <p style="margin:6px 0;">ต้องการให้ Levophed ทาง practical format: concentration ที่ผสม และ starting rate ที่ใช้บ่อยคือเท่าไร?</p>
                    <button class="btn-sub" onclick="document.getElementById('ans-1').style.display='block'">เฉลยคำตอบ</button>
                    <div id="ans-1" style="display:none; margin-top:8px;" class="usual-box">
                        <strong>My Usual Practice:</strong> Levophed 1:250 (4mg/250ml) เริ่ม 30 ml/hr ไตเตรทตาม MAP >= 65
                    </div>
                </div>
            `;
        }

        function renderDrugs() {
            setActiveNav('btn-drugs');
            const root = document.getElementById('app-root');
            root.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="margin:0;">💊 Emergency Drugs</h3>
                    <button class="btn-sub" onclick="showAddDrugForm()">+ เพิ่มยา</button>
                </div>
                <input type="text" id="drug-search" placeholder="ค้นหา Generic หรือ Brand..." oninput="filterDrugs(this.value)">
                <div id="drug-container"></div>
            `;
            updateDrugList(db.drugs);
        }

        function updateDrugList(list) {
            const container = document.getElementById('drug-container');
            if (!container) return;
            let html = '';
            list.forEach(d => {
                const realIndex = db.drugs.findIndex(x => x.id === d.id);
                html += `
                    <div class="item-card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong style="font-size:1rem; color:#fff;">${d.generic} (${d.brand})</strong>
                            <button class="btn-sub" style="color:var(--danger); border-color:var(--danger);" onclick="deleteDrug(${realIndex})">ลบ</button>
                        </div>
                        <p style="margin:4px 0 8px; font-size:0.85rem; color:var(--text-sub);">Indication: ${d.indication}</p>
                        <div class="standard-box">
                            <strong style="color:var(--accent);">📋 Standard Practice</strong><br>Dose: ${d.std_dose} | Route: ${d.std_route}<br>Prep: ${d.std_prep}<br><span style="font-size:0.75rem; color:#888;">Source: ${d.source}</span>
                        </div>
                        <div class="usual-box">
                            <strong style="color:var(--warning);">⚡ My Usual Practice</strong><br>${d.usual_practice}<br><span style="font-size:0.8rem; color:#ccc;">Note: ${d.notes}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function filterDrugs(kw) {
            const res = db.drugs.filter(d => 
                d.generic.toLowerCase().includes(kw.toLowerCase()) || 
                d.brand.toLowerCase().includes(kw.toLowerCase())
            );
            updateDrugList(res);
        }

        function showAddDrugForm() {
            const root = document.getElementById('app-root');
            root.innerHTML = `
                <h3 style="margin-top:0;">+ เพิ่มรายการยา</h3>
                <input type="text" id="add-generic" placeholder="Generic Name">
                <input type="text" id="add-brand" placeholder="Brand Name">
                <input type="text" id="add-indication" placeholder="Indication">
                <input type="text" id="add-dose" placeholder="Standard Dose">
                <input type="text" id="add-route" placeholder="Route">
                <input type="text" id="add-prep" placeholder="Preparation">
                <input type="text" id="add-source" placeholder="Source + Version">
                <textarea id="add-usual" placeholder="My Usual Practice"></textarea>
                <textarea id="add-notes" placeholder="Notes"></textarea>
                <button class="btn" onclick="saveNewDrug()">บันทึกข้อมูลยา</button>
                <button class="btn-sub" style="width:100%; margin-top:8px;" onclick="renderDrugs()">ยกเลิก</button>
            `;
        }

        function saveNewDrug() {
            const generic = document.getElementById('add-generic').value.trim();
            if (!generic) return alert('กรุณาระบุ Generic Name');
            
            db.drugs.push({
                id: 'd_' + Date.now(),
                generic: generic,
                brand: document.getElementById('add-brand').value.trim() || '-',
                indication: document.getElementById('add-indication').value.trim() || '-',
                std_dose: document.getElementById('add-dose').value.trim() || '-',
                std_route: document.getElementById('add-route').value.trim() || '-',
                std_prep: document.getElementById('add-prep').value.trim() || '-',
                source: document.getElementById('add-source').value.trim() || 'Manual Input',
                usual_practice: document.getElementById('add-usual').value.trim() || '-',
                notes: document.getElementById('add-notes').value.trim() || '-',
                status: 'READY'
            });
            saveDB();
            renderDrugs();
        }

        function deleteDrug(index) {
            if (confirm('ยืนยันลบรายการยานี้?')) {
                db.drugs.splice(index, 1);
                saveDB();
                renderDrugs();
            }
        }

        function renderEKG() {
            setActiveNav('btn-ekg');
            const root = document.getElementById('app-root');
            let html = `<h3 style="margin-top:0;">❤️ EKG Error Bank</h3>`;
            db.ekg.forEach(e => {
                html += `
                    <div class="item-card">
                        <strong style="color:var(--warning); font-size:1rem;">${e.diagnosis}</strong>
                        <p style="margin:6px 0; color:var(--danger); font-size:0.85rem;">Immediate Danger: ${e.danger}</p>
                        <div style="font-size:0.85rem; background:#1c1c1c; padding:10px; border-radius:6px; margin:8px 0;">
                            <div><strong>Pass 1 (See):</strong> ${e.step1_see}</div>
                            <div style="margin-top:4px;"><strong>Pass 2 (Localize):</strong> ${e.step2_localize}</div>
                            <div style="margin-top:4px;"><strong>Pass 3 (Differential):</strong> ${e.step3_differentials}</div>
                            <div style="margin-top:4px;"><strong>Pass 4 (Danger):</strong> ${e.step4_immediate_danger}</div>
                            <div style="margin-top:4px;"><strong>Pass 5 (Action):</strong> ${e.step5_management}</div>
                        </div>
                    </div>
                `;
            });
            root.innerHTML = html;
        }

        function renderProcedures() {
            setActiveNav('btn-procedures');
            const root = document.getElementById('app-root');
            let html = `<h3 style="margin-top:0;">🔧 Procedure Cards</h3>`;
            db.procedures.forEach(p => {
                html += `
                    <div class="item-card">
                        <strong style="color:var(--accent); font-size:1rem;">${p.name}</strong>
                        <p style="margin:6px 0; font-size:0.85rem;"><strong>Indication:</strong> ${p.indication}</p>
                        <p style="margin:6px 0; font-size:0.85rem;"><strong>Equipment:</strong> ${p.equipment}</p>
                        <div class="usual-box"><strong>Steps:</strong><br>${p.steps}</div>
                        <p style="margin:6px 0; font-size:0.85rem; color:var(--text-sub);">Confirmation: ${p.confirmation}</p>
                    </div>
                `;
            });
            root.innerHTML = html;
        }

        // เริ่มต้นโหลดฐานข้อมูล
        initDatabase();
    </script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker Registered!', reg))
            .catch(err => console.log('Service Worker Registration Failed!', err));
        });
      }
    </script>
</body>
</html>
