<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY ER EXTERNAL BRAIN</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#03dac6">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-hover: #2a2a2a;
            --text-main: #f0f0f0;
            --text-sub: #a0a0a0;
            --accent: #03dac6;
            --warning: #ffb74d;
            --danger: #cf6679;
            --border: #333333;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .header-left h1 { font-size: 1.2rem; margin: 0; color: var(--accent); }
        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            background: var(--accent);
            color: #000;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            color: var(--text-main);
            transition: 0.2s;
        }
        .nav-btn:hover { background: var(--surface-hover); }
        .nav-btn.active { border-color: var(--accent); background: #242424; }
        .nav-btn h3 { margin: 0 0 4px 0; font-size: 0.9rem; color: #fff; }
        .nav-btn span { font-size: 0.75rem; color: var(--text-sub); }
        .content-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            min-height: 450px;
        }
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 6px;
        }
        .btn-sub {
            background: #333;
            color: #fff;
            border: 1px solid var(--border);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-srs-again { background: var(--danger); color: #000; font-weight: bold; flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-srs-good { background: var(--warning); color: #000; font-weight: bold; flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-srs-easy { background: var(--accent); color: #000; font-weight: bold; flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #242424;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .item-card {
            background: #252525;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .standard-box {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin: 8px 0;
            background: rgba(3, 218, 198, 0.05);
            font-size: 0.85rem;
        }
        .usual-box {
            border-left: 3px solid var(--warning);
            padding-left: 10px;
            margin: 8px 0;
            background: rgba(255, 183, 77, 0.05);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>MY ER EXTERNAL BRAIN</h1>
            <span class="badge">v3.2 CPR Module</span>
        </div>
        <button class="btn-sub" onclick="renderSettings()" style="width: auto; background: var(--surface);">⚙️ ตั้งค่า</button>
    </header>

    <div class="nav-grid">
        <button class="nav-btn" onclick="renderReview()" id="btn-review">
            <h3>🧠 Daily Review (SRS)</h3>
            <span>Smart Spaced Repetition</span>
        </button>
        <button class="nav-btn" onclick="renderDrugs()" id="btn-drugs">
            <h3>💊 Drugs</h3>
            <span>Standard vs Usual</span>
        </button>
        <button class="nav-btn" onclick="renderEKG()" id="btn-ekg">
            <h3>❤️ EKG Module</h3>
            <span>5-Step & Error Bank</span>
        </button>
        <button class="nav-btn" onclick="renderProcedures()" id="btn-procedures">
            <h3>🔧 Procedures</h3>
            <span>Walkthrough Cards</span>
        </button>
        <button class="nav-btn" onclick="renderCPR()" id="btn-cpr" style="grid-column: span 2;">
            <h3>⚡ CPR & ACLS Protocols</h3>
            <span>Cardiac Arrest & Reversible Causes</span>
        </button>
    </div>

    <div id="app-root" class="content-box"></div>

    <script>
        const initialDB = {
            drugs: [
                {
                    id: "d1",
                    generic: "Norepinephrine",
                    brand: "Levophed",
                    indication: "Septic shock / Distributive shock",
                    std_dose: "2 - 20 mcg/min",
                    std_route: "IV Infusion (Central line preferred)",
                    std_prep: "4 mg in D5W/NSS 250 ml (16 mcg/ml)",
                    source: "AHA Guidelines | Status: VERIFIED",
                    usual_practice: "Levophed 1:250 (4mg/250ml) เริ่ม 30 ml/hr Titrate ตาม MAP >= 65",
                    notes: "ระวัง peripheral extravasation รุนแรง หากไม่มี central line ต้องรีบเปิดเส้นใหญ่"
                },
                {
                    id: "d2",
                    generic: "Levetiracetam",
                    brand: "Keppra",
                    indication: "Status Epilepticus (Second-line)",
                    std_dose: "60 mg/kg (Max 4,500 mg)",
                    std_route: "IV Infusion over 15 mins",
                    std_prep: "Keppra dose + NSS 100 ml",
                    source: "AES Guidelines 2016",
                    usual_practice: "Keppra 1,000 - 2,000 mg + NSS 100 ml IV drip in 15 mins",
                    notes: "ปลอดภัยเรื่อง Hemodynamic แต่ห้าม IV push เร็วเด็ดขาด ต้องให้ผ่าน infusion 15 นาทีเสมอ"
                },
                {
                    id: "d3",
                    generic: "Midazolam / Diazepam",
                    brand: "Dormicum / Valium",
                    indication: "Active Seizure (No IV access)",
                    std_dose: "Midazolam 10 mg (>40 kg) หรือ Diazepam 10-20 mg",
                    std_route: "IM",
                    std_prep: "Undiluted",
                    source: "ER Protocols",
                    usual_practice: "หากหาเส้นไม่ได้ให้ Midazolam 5-10 mg IM (ดีกว่า) หรือ Valium 10 mg IM ตามทรัพยากร",
                    notes: "Valium ฉีด IM ดูดซึมไม่สม่ำเสมอ เตรียมเครื่องมือ Airway management เผื่อ Respiratory depression"
                },
                {
                    id: "d4",
                    generic: "Adenosine",
                    brand: "Adenocor",
                    indication: "SVT (Regular Narrow Complex Tachycardia)",
                    std_dose: "1st dose: 6 mg / 2nd dose: 12 mg",
                    std_route: "Rapid IV push",
                    std_prep: "Undiluted (ยามาเป็น 6 mg / 2 ml)",
                    source: "ACLS Algorithm",
                    usual_practice: "ต่อ 3-way, Rapid IV push 6 mg เข้าเส้นเลือดใหญ่ ตามด้วย NSS flush 20 ml ทันทีพร้อมยกแขนขึ้น",
                    notes: "เตือนคนไข้ก่อนฉีดว่าจะรู้สึกแน่นหน้าอก/หวิว และต้องติด Monitor EKG ตลอด"
                },
                {
                    id: "d5",
                    generic: "Epinephrine / Dexamethasone",
                    brand: "Adrenaline / Dexa",
                    indication: "Severe Asthma / Silent Chest",
                    std_dose: "Adrenaline 0.3-0.5 mg IM / Dexa 8-10 mg IV",
                    std_route: "IM / IV",
                    std_prep: "Adrenaline 1:1,000 undiluted",
                    source: "GINA Guidelines",
                    usual_practice: "ถ้า Silent Chest พ่นยาไม่เข้า ให้ Adrenaline 0.3-0.5 ml IM ทันที + Load Dexa 8-10 mg IV",
                    notes: "ระวัง Hypokalemia เตรียมอุปกรณ์ Intubation เสมอในเคส Silent Chest"
                }
            ],
            ekg: [
                {
                    id: "e1",
                    diagnosis: "Acute Posterior STEMI",
                    danger: "Delayed reperfusion therapy",
                    step1_see: "ST depression lead V1-V3 with tall, broad R waves and upright T waves",
                    step2_localize: "Posterior wall (LCx or RCA)",
                    step3_differentials: "Anterior NSTEMI, Posterior STEMI, RV strain",
                    step4_immediate_danger: "Extensive myocardial necrosis without typical ST elevation",
                    step5_management: "ทำ EKG Leads V7-V9 ทันที (เกณฑ์ >= 0.5 mm) เพื่อเปิด Cath Lab"
                }
            ],
            procedures: [
                {
                    id: "p1",
                    name: "Emergency Cricothyroidotomy",
                    indication: "Cannot Intubate, Cannot Oxygenate (CICO)",
                    contraindication: "Laryngeal trauma / Tracheal transection (relative)",
                    equipment: "Scalpel No.11, Bougie, ET tube No.6.0, Tracheal hook",
                    steps: "1. Stabilize larynx -> 2. กรีดแนวตั้งผ่านผิวหนัง -> 3. กรีดแนวนอนผ่าน cricothyroid membrane -> 4. สอด Bougie เข้า trachea -> 5. Railroad ท่อเบอร์ 6 ตาม bougie เข้าไป",
                    confirmation: "EtCO2, Chest movement, Auscultation"
                }
            ],
            cpr: [
                {
                    id: "cpr1",
                    title: "VF / Pulseless VT Protocol",
                    rhythm: "Shockable Rhythm",
                    steps: "1. Defibrillation (Biphasic ตามเครื่อง เช่น 120-200J) -> 2. CPR ต่อเนื่อง 2 นาที -> 3. ให้ Adrenaline 1 mg IV ทุก 3-5 นาที (เริ่มตั้งแต่ Shock ครั้งที่ 2) -> 4. พิจารณาให้ Amiodarone 300 mg IV (ซ้ำ 150 mg ได้) หากยัง Refractory VF/VT",
                    usual_notes: "เน้น High-quality CPR ห้าม Interrupt การกดนาน เตรียม Pad แปะให้พร้อมก่อนช็อก"
                },
                {
                    id: "cpr2",
                    title: "Asystole / PEA Protocol",
                    rhythm: "Non-Shockable Rhythm",
                    steps: "1. High-quality CPR ทันที 2 นาที -> 2. ให้ Adrenaline 1 mg IV เร็วที่สุด และซ้ำทุก 3-5 นาที -> 3. ค้นหาและแก้ไขสาเหตุที่ย้อนกลับได้ (H's & T's)",
                    usual_notes: "ห้ามช็อกเด็ดขาด รีบหาเส้นทางเดินหายใจและหาสาเหตุ H&T ทันที"
                },
                {
                    id: "cpr3",
                    title: "Reversible Causes (H's & T's)",
                    rhythm: "Checklist ฉุกเฉิน",
                    steps: "• H: Hypovolemia, Hypoxia, Hydrogen ion (Acidosis), Hypo/Hyperkalemia, Hypothermia, Hypoglycemia\n• T: Tension pneumothorax, Tamponade (cardiac), Toxins, Thrombosis (pulmonary & coronary)",
                    usual_notes: "นึกถึงเสมอในเคส PEA/Asystole ทำ POCUS (Bedside Ultrasound) เพื่อช่วยหา Cardiac tamponade และ Pneumothorax"
                }
            ],
            srsCards: [
                {
                    id: "sc1",
                    topic: "Septic Shock Prescribing",
                    question: "ต้องการให้ Levophed practical concentration และ starting rate เท่าไร?",
                    answer: "Levophed 1:250 (4mg/250ml) เริ่ม 30 ml/hr Titrate ตาม MAP >= 65",
                    interval: 0, repetition: 0, easeFactor: 2.5, dueDate: 0
                },
                {
                    id: "sc2",
                    topic: "ACLS VF/VT Drug Protocol",
                    question: "ในเคส VF/VT ที่ช็อกครั้งแรกไปแล้ว เริ่มให้ Adrenaline 1 mg IV ได้ตั้งแต่ Shock ครั้งที่เท่าไร?",
                    answer: "ให้ Adrenaline 1 mg IV ได้ตั้งแต่รอบการให้ยาหลังจาก Shock ครั้งที่ 2 เป็นต้นไป",
                    interval: 0, repetition: 0, easeFactor: 2.5, dueDate: 0
                }
            ]
        };

        const dbKey = 'er_brain_db_v3_2_cpr';
        if (!localStorage.getItem(dbKey)) {
            localStorage.setItem(dbKey, JSON.stringify(initialDB));
        }
        let db = JSON.parse(localStorage.getItem(dbKey));
        if (!db.cpr) {
            db.cpr = initialDB.cpr;
            saveDB();
        }

        function saveDB() {
            localStorage.setItem(dbKey, JSON.stringify(db));
        }

        function setActiveNav(btnId) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btnId) {
                const btn = document.getElementById(btnId);
                if (btn) btn.classList.add('active');
            }
        }

        // ==========================================
        // SRS DAILY REVIEW MODULE
        // ==========================================
        let currentCardIndex = 0;
        let dueCards = [];

        function renderReview() {
            setActiveNav('btn-review');
            const now = Date.now();
            dueCards = db.srsCards.filter(c => c.dueDate <= now);
            if (dueCards.length === 0) {
                dueCards = [...db.srsCards];
            }
            currentCardIndex = 0;
            showSrsCard();
        }

        function showSrsCard() {
            const root = document.getElementById('app-root');
            if (currentCardIndex >= dueCards.length) {
                root.innerHTML = `
                    <div style="text-align:center; padding:40px 20px;">
                        <h2 style="color:var(--accent); margin-top:0;">🎉 ทบทวนครบทุกการ์ดแล้ว!</h2>
                        <p style="color:var(--text-sub);">สมองของคุณได้รับการรีเฟรชความจำเรียบร้อยแล้ว เยี่ยมมากครับหมอ</p>
                        <button class="btn" style="max-width:200px; margin:20px auto 0;" onclick="renderReview()">เริ่มทบทวนใหม่อีกรอบ</button>
                    </div>
                `;
                return;
            }

            const card = dueCards[currentCardIndex];
            root.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h3 style="margin:0; color:var(--accent);">🧠 Daily Review (SRS)</h3>
                    <span style="font-size:0.75rem; color:var(--text-sub);">การ์ดที่ ${currentCardIndex + 1} จาก ${dueCards.length}</span>
                </div>
                
                <div class="item-card" style="padding:16px;">
                    <span style="display:inline-block; padding:3px 8px; font-size:0.7rem; border-radius:4px; font-weight:bold; background:#333; color:var(--warning); margin-bottom:8px;">🏷️ ${card.topic}</span>
                    <p style="font-size:1.05rem; margin:8px 0 16px; font-weight:500;">${card.question}</p>
                    
                    <button class="btn-sub" id="reveal-btn" onclick="revealAnswer()" style="width:100%; padding:10px; background:#2a2a2a; border-color:var(--border);">👁️ เปิดดูเฉลย</button>
                    
                    <div id="answer-section" style="display:none; margin-top:16px;">
                        <div class="usual-box" style="padding:12px; font-size:0.95rem;">
                            <strong>เฉลย (My Usual Practice):</strong><br>${card.answer}
                        </div>
                        <p style="font-size:0.8rem; color:var(--text-sub); margin:12px 0 6px; text-align:center;">ประเมินระดับความยากในการจำข้อนี้:</p>
                        <div style="display:flex; gap:8px;">
                            <button class="btn-srs-again" onclick="gradeCard('again')">🔴 ลืมสนิท (Again)</button>
                            <button class="btn-srs-good" onclick="gradeCard('good')">🟡 พอจำได้ (Good)</button>
                            <button class="btn-srs-easy" onclick="gradeCard('easy')">🟢 จำได้แม่น (Easy)</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function revealAnswer() {
            document.getElementById('reveal-btn').style.display = 'none';
            document.getElementById('answer-section').style.display = 'block';
        }

        function gradeCard(grade) {
            const card = dueCards[currentCardIndex];
            const originalCard = db.srsCards.find(c => c.id === card.id);
            const now = Date.now();
            const ONE_DAY = 24 * 60 * 60 * 1000;

            if (grade === 'again') {
                originalCard.repetition = 0;
                originalCard.interval = 0;
                originalCard.dueDate = now;
            } else if (grade === 'good') {
                originalCard.repetition += 1;
                if (originalCard.repetition === 1) originalCard.interval = 1;
                else if (originalCard.repetition === 2) originalCard.interval = 3;
                else originalCard.interval = Math.round(originalCard.interval * originalCard.easeFactor);
                originalCard.dueDate = now + (originalCard.interval * ONE_DAY);
            } else if (grade === 'easy') {
                originalCard.repetition += 1;
                originalCard.easeFactor += 0.15;
                if (originalCard.repetition === 1) originalCard.interval = 3;
                else originalCard.interval = Math.round(originalCard.interval * originalCard.easeFactor * 1.3);
                originalCard.dueDate = now + (originalCard.interval * ONE_DAY);
            }

            saveDB();
            currentCardIndex++;
            showSrsCard();
        }

        // ==========================================
        // DRUGS MODULE WITH SEARCH BAR
        // ==========================================
        function renderDrugs() {
            setActiveNav('btn-drugs');
            const root = document.getElementById('app-root');
            root.innerHTML = `
                <h3 style="margin-top:0;">💊 Emergency Drugs</h3>
                <input type="text" id="drug-search" placeholder="🔍 ค้นหา Generic หรือ Brand..." oninput="filterDrugs(this.value)">
                <div id="drug-container"></div>
            `;
            updateDrugList(db.drugs);
        }

        function updateDrugList(list) {
            const container = document.getElementById('drug-container');
            if (!container) return;
            if (list.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-sub); padding:20px;">ไม่พบรายการยาที่ค้นหา</p>`;
                return;
            }
            let html = '';
            list.forEach(d => {
                html += `
                    <div class="item-card">
                        <strong style="font-size:1rem; color:#fff;">${d.generic} (${d.brand})</strong>
                        <p style="margin:4px 0 8px; font-size:0.85rem; color:var(--text-sub);">Indication: ${d.indication}</p>
                        <div class="standard-box">
                            <strong style="color:var(--accent);">📋 Standard Practice</strong><br>Dose: ${d.std_dose} | Route: ${d.std_route}<br>Prep: ${d.std_prep}
                        </div>
                        <div class="usual-box">
                            <strong style="color:var(--warning);">⚡ My Usual Practice</strong><br>${d.usual_practice}<br><span style="font-size:0.80rem; color:#ccc;">Note: ${d.notes}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function filterDrugs(kw) {
            const res = db.drugs.filter(d => 
                d.generic.toLowerCase().includes(kw.toLowerCase()) || 
                d.brand.toLowerCase().includes(kw.toLowerCase()) ||
                d.indication.toLowerCase().includes(kw.toLowerCase())
            );
            updateDrugList(res);
        }

        // ==========================================
        // CPR & ACLS PROTOCOLS MODULE
        // ==========================================
        function renderCPR() {
            setActiveNav('btn-cpr');
            const root = document.getElementById('app-root');
            let html = `<h3 style="margin-top:0;">⚡ CPR & ACLS Protocols</h3>`;
            db.cpr.forEach(c => {
                html += `
                    <div class="item-card">
                        <strong style="color:var(--accent); font-size:1rem;">${c.title}</strong>
                        <p style="margin:4px 0 8px; font-size:0.85rem; color:var(--danger);">Type: ${c.rhythm}</p>
                        <div class="standard-box" style="white-space: pre-line;">
                            <strong>Steps / Management:</strong><br>${c.steps}
                        </div>
                        <div class="usual-box" style="white-space: pre-line;">
                            <strong>⚡ Usual Practice / Pearls:</strong><br>${c.usual_notes}
                        </div>
                    </div>
                `;
            });
            root.innerHTML = html;
        }

        // ==========================================
        // SETTINGS & BACKUP / EXPORT / IMPORT
        // ==========================================
        function renderSettings() {
            setActiveNav(null);
            const root = document.getElementById('app-root');
            root.innerHTML = `
                <h3 style="margin-top:0; color:var(--accent);">⚙️ ระบบจัดการข้อมูล & สำรองข้อมูล</h3>
                <p style="font-size:0.85rem; color:var(--text-sub);">ไฟล์ JSON สำรองจะบันทึกข้อมูลยาทั้งหมด EKG, Procedures, CPR และสถิติ SRS ของคุณไว้ครบถ้วน</p>
                
                <div class="item-card" style="margin-top:20px;">
                    <strong style="color:var(--accent); font-size:1rem;">💾 สำรองข้อมูล (Export JSON)</strong>
                    <button class="btn" style="margin-top:8px;" onclick="exportData()">ดาวน์โหลดไฟล์ Backup</button>
                </div>

                <div class="item-card" style="margin-top:20px;">
                    <strong style="color:var(--warning); font-size:1rem;">📂 กู้คืนข้อมูล (Import JSON)</strong>
                    <input type="file" id="import-file" accept=".json" style="background:transparent; border:1px solid #444; padding:6px; font-size:0.8rem; margin:8px 0;">
                    <button class="btn" style="background:var(--warning); color:#000;" onclick="importData()">นำเข้าข้อมูล</button>
                </div>

                <div class="item-card" style="margin-top:30px; border-color:var(--danger);">
                    <strong style="color:var(--danger); font-size:1rem;">🔄 รีเซ็ตข้อมูลทั้งหมด</strong>
                    <button class="btn" style="background:var(--danger); color:#000; margin-top:8px;" onclick="localStorage.clear(); location.reload();">ล้างข้อมูลและรีเซ็ต</button>
                </div>
            `;
        }

        function exportData() {
            const dataStr = JSON.stringify(db, null, 4);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'ER_External_Brain_Backup.json');
            document.body.appendChild(linkElement);
            linkElement.click();
            document.body.removeChild(linkElement);
        }

        function importData() {
            const fileInput = document.getElementById('import-file');
            if (!fileInput.files.length) {
                alert("กรุณาเลือกไฟล์ .json ก่อนครับ");
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedDB = JSON.parse(e.target.result);
                    if (importedDB && Array.isArray(importedDB.drugs)) {
                        db = importedDB;
                        saveDB();
                        alert("✅ นำเข้าข้อมูลสำเร็จ!");
                        renderReview();
                    } else {
                        alert("❌ โครงสร้างไฟล์ไม่ถูกต้อง");
                    }
                } catch (err) {
                    alert("❌ เกิดข้อผิดพลาดในการอ่านไฟล์: " + err);
                }
            };
            reader.readAsText(file);
        }

        function renderEKG() {
            setActiveNav('btn-ekg');
            const root = document.getElementById('app-root');
            let html = `<h3 style="margin-top:0;">❤️ EKG Error Bank</h3>`;
            db.ekg.forEach(e => {
                html += `
                    <div class="item-card">
                        <strong style="color:var(--warning); font-size:1rem;">${e.diagnosis}</strong>
                        <p style="margin:6px 0; color:var(--danger); font-size:0.85rem;">Danger: ${e.danger}</p>
                        <div style="font-size:0.85rem; background:#1c1c1c; padding:10px; border-radius:6px;">
                            <div><strong>See:</strong> ${e.step1_see}</div>
                            <div style="margin-top:4px;"><strong>Action:</strong> ${e.step5_management}</div>
                        </div>
                    </div>
                `;
            });
            root.innerHTML = html;
        }

        function renderProcedures() {
            setActiveNav('btn-procedures');
            const root = document.getElementById('app-root');
            let html = `<h3 style="margin-top:0;">🔧 Procedure Cards</h3>`;
            db.procedures.forEach(p => {
                html += `
                    <div class="item-card">
                        <strong style="color:var(--accent); font-size:1rem;">${p.name}</strong>
                        <p style="margin:6px 0; font-size:0.85rem;"><strong>Indication:</strong> ${p.indication}</p>
                        <div class="usual-box"><strong>Steps:</strong><br>${p.steps}</div>
                    </div>
                `;
            });
            root.innerHTML = html;
        }

        renderReview();
    </script>
</body>
</html>
